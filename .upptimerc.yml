status-website:
  cname: status.jettaintelligence.com
  logoUrl: https://raw.githubusercontent.com/jetta-operating/status.jettaintelligence.com/master/assets/logo/jetta-status-logo.svg
  name: Jetta Service Status
  introTitle: "**Jetta Service Status**"
  introMessage: Public uptime and dependency checks for the Jetta-managed operating stack across Jetta Intelligence, AIC, and Greenmark. Incidents are generated from GitHub Actions probes and published through GitHub Pages.
  faviconSvg: https://raw.githubusercontent.com/jetta-operating/status.jettaintelligence.com/master/assets/logo/jetta-status-logo.svg
  css: "nav .logo div::after { content: 'Operating stack'; display: block; margin-top: 0.1rem; color: #cfd8d2; font-size: 0.72rem; font-weight: 500; letter-spacing: 0; }"
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * 0"
  updates: "0 3 * * *"
  uptime: "*/15 * * * *"

assignees:
  - dshanklin-bv

skipDeleteIssues: true
