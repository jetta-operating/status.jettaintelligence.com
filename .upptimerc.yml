status-website:
  cname: status.jettaintelligence.com
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Jetta Service Status
  introTitle: Jetta Service Status
  introMessage: External uptime and status checks for Jetta-managed services across Jetta Intelligence, AIC, and Greenmark. This page is powered by GitHub Actions and GitHub Pages, not Railway.
